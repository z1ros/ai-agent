[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-enrichment"
version = "1.0.0"
description = "Provider-agnostic email enrichment service with MCP and REST transports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
enrich-api = "enrich.server.api:main"
enrich-mcp = "enrich.server.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/enrich"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented pattern
    "UP042",  # str+Enum is kept over StrEnum: identical JSON output, and it
              # keeps the models importable on any 3.11 runtime without
              # depending on StrEnum's differing __str__ semantics
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are the point of a test

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mcp.*", "uvicorn.*"]
ignore_missing_imports = true
